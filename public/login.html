<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | ASP Calculator</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <p class="eyebrow">Shopify + NetSuite</p>
        <h1 id="login-title">ASP Calculator</h1>
        <form id="loginForm" class="login-form">
          <label class="field">
            <span>Password</span>
            <input id="password" type="password" autocomplete="current-password" autofocus>
          </label>
          <button id="loginButton" class="primary" type="submit">Log in</button>
          <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="/login.js" type="module"></script>
  </body>
</html>
